<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>무쌍 오로치 2 얼티밋 한국어 패치</title>
  <meta name="description" content="PS3 무쌍 오로치 2 얼티밋 (無双OROCHI2 Ultimate, BLJM61084) 한국어 번역 패치 문서" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    /* ================================================================
       팔레트 — 오로치의 흑적(黑赤)
       칠흑 배경 / 붉은 주조색 / 금박 강조 / 재색 본문
       ================================================================ */
    :root {
      --bg:        #141014;  /* Ink Black    — 칠흑 배경 */
      --bg-deep:   #0C090C;  /* 코드 블록 등 더 어두운 면 */
      --surface:   #241A1E;  /* 표면 */
      --surface-2: #2F2127;  /* 표면 강조 */
      --primary:   #E0473C;  /* Orochi Red   — 주조색 */
      --primary-d: #B7342C;  /* 호버 */
      --accent:    #D9B24C;  /* Gilt Gold    — 강조(한 곳만) */
      --accent-d:  #B08F2E;  /* 강조 호버 */
      --neutral:   #CFC6BC;  /* Ash          — 보조 텍스트 */
      --text:      #F4EFE8;  /* Bone White */
      --text-dim:  #A89E94;
      --line:      #3B2B31;
      --theme-color: #E0473C;
    }

    * { -webkit-font-smoothing: antialiased; }

    html, body { background: var(--bg); }
    body {
      font-family: 'Noto Sans KR', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
      color: var(--text);
    }

    /* 붉은 기운이 스미는 배경 */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 500px at 80% 6%, rgba(224,71,60,.16), transparent 60%),
        radial-gradient(700px 420px at 10% 94%, rgba(217,178,76,.07), transparent 60%),
        var(--bg);
    }

    /* ---- 본문 ---- */
    .markdown-section { max-width: 880px; color: var(--text); }
    .markdown-section h1 { font-weight: 900; letter-spacing: -0.02em; color: var(--text); }
    .markdown-section h2 {
      font-weight: 700; color: var(--text);
      border-bottom: 2px solid var(--line);
      padding-bottom: .35em; margin-top: 2.6rem; letter-spacing: -0.01em;
    }
    /* 검날을 연상시키는 마름모 불릿 */
    .markdown-section h2::before {
      content: ""; display: inline-block; width: .5em; height: .5em;
      margin-right: .55em; background: var(--primary);
      box-shadow: 0 0 10px rgba(224,71,60,.6);
      transform: rotate(45deg); vertical-align: middle;
    }
    .markdown-section h3 { color: var(--neutral); font-weight: 700; }
    .markdown-section h4, .markdown-section h5 { color: var(--neutral); }
    .markdown-section p, .markdown-section li { color: var(--text); }
    .markdown-section strong { color: #FFFFFF; }
    .markdown-section hr { border-color: var(--line); }

    .markdown-section a { color: var(--primary); font-weight: 500; text-decoration: none; }
    .markdown-section a:hover { color: var(--primary-d); text-decoration: underline; }

    /* ---- 표 ---- */
    .markdown-section table { border-collapse: collapse; width: 100%; }
    .markdown-section th {
      background: var(--surface); color: var(--text);
      font-weight: 700; border: 1px solid var(--line);
    }
    .markdown-section td { border: 1px solid var(--line); color: var(--text); }
    .markdown-section tr { background: transparent; }
    .markdown-section tr:nth-child(2n) { background: rgba(36,26,30,.6); }
    /* 표가 넓으면 표만 가로 스크롤 */
    .markdown-section table { display: block; overflow-x: auto; white-space: nowrap; }

    /* ---- 인용 / 코드 ---- */
    .markdown-section blockquote {
      border-left: 4px solid var(--accent);
      background: rgba(217,178,76,.10);
      color: var(--text); border-radius: 0 6px 6px 0;
    }
    .markdown-section blockquote strong { color: var(--accent); }
    .markdown-section code {
      color: var(--accent); background: rgba(36,26,30,.85);
      border: 1px solid var(--line); border-radius: 4px;
    }
    .markdown-section pre { background: var(--bg-deep); border: 1px solid var(--line); }
    .markdown-section pre > code { color: #E9E1D8; background: transparent; border: 0; }
    .markdown-section pre::after { color: var(--text-dim); }

    /* ---- 사이드바 ---- */
    .sidebar { background: rgba(12,9,12,.94); border-right: 1px solid var(--line); }
    .sidebar .app-name-link {
      color: var(--primary) !important; font-weight: 900;
      text-shadow: 0 0 14px rgba(224,71,60,.45);
    }
    .sidebar ul li a { color: var(--text-dim); }
    .sidebar ul li a:hover { color: var(--primary); }
    .sidebar ul li.active > a {
      color: var(--primary); font-weight: 700;
      border-right: 3px solid var(--primary);
    }
    .sidebar-toggle { background-color: transparent; }
    .sidebar-toggle span { background-color: var(--primary); }

    /* ---- 검색 ---- */
    .search input {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
    }
    .search input::placeholder { color: var(--text-dim); }
    .search .results-panel { background: var(--bg-deep); }
    .search p, .search h2 { color: var(--text) !important; }
    .search .matching-post { border-bottom: 1px solid var(--line); }
    .search .matching-post a { color: var(--primary); }
    .search .clear-button { color: var(--text-dim); }

    /* ---- 페이지네이션 ---- */
    .pagination-item-label, .pagination-item-title { color: var(--text-dim); }
    .pagination-item-title { color: var(--primary) !important; }
    .docsify-pagination-container { border-top: 1px solid var(--line); }

    /* ---- 코드 복사 버튼 ---- */
    .docsify-copy-code-button {
      background: var(--surface) !important; color: var(--text) !important;
      border: 1px solid var(--line);
    }

    /* 강조 배너 — 금색은 여기 하나에만 */
    .hero-note {
      border: 1px solid var(--accent);
      background: linear-gradient(180deg, rgba(217,178,76,.14), rgba(217,178,76,.05));
      border-radius: 8px; padding: 1rem 1.2rem; margin: 1.4rem 0;
    }
  </style>
</head>
<body>
  <div id="app">불러오는 중…</div>
  <script>
    window.$docsify = {
      name: '🐉 무쌍 오로치 2 얼티밋<br><small style="font-weight:400;opacity:.7">한국어 패치</small>',
      repo: 'https://github.com/kimjh-eclipse/musou-orochi-2-ultimate-kor',
      homepage: 'home.md',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 3,
      relativePath: true,
      notFoundPage: true,
      search: {
        placeholder: '문서 검색…',
        noData: '검색 결과가 없습니다.',
        depth: 4
      },
      pagination: {
        previousText: '이전',
        nextText: '다음',
        crossChapter: true
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
